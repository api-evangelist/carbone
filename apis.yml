  - type: SDKs
    url: https://github.com/carboneio/carbone-sdk-js
- aid: carbone:on-prem
  name: Carbone On-Premises
  description: >-
    Self-hosted Carbone deployment exposing the same HTTP API. Auth disabled by default; enable via configuration.
    30-day free trial of paid features.
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
