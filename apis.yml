apis:
- aid: carbone:cloud
  name: Carbone Cloud HTTP API
  description: >-
    Cloud-hosted Carbone API. Two flows — upload-once via POST /template then render with a template ID;
    or single-request inline-base64 render. Bearer-token auth (Authorization header). Sync and async via
    webhooks. Hosted on European providers (OVHCloud, Scaleway, BunnyCDN).
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://carbone.io/api-reference.html
  baseURL: https://api.carbone.io
  tags:
  - REST
  - Templates
  - Render
  - Async
  - Webhook
  tags_raw:
  - REST
  - Templates
  - Render
  - Async
  - Webhooks
