    UnauthorizedError:
      description: 'Unauthorized, please provide a correct API key on the `Authorization` header. The API key is available on your Carbone account: https://account.carbone.io'
      content:
        application/json:
          schema:
            type: object
          examples:
            invalidKey:
              summary: The API key is missing or invalid.
              value:
                success: false
                error: 'Unauthorized, please provide a correct API key on the "Authorization" header. The API key is available on your Carbone account: https://account.carbone.io'
                code: w120
            expiredKey:
              summary: The API key or access token has expired.
              value:
                success: false
                error: 'Unauthorized Access: The API key or access token has expired.'
    MissingDataFieldError:
      description: 'The ''data'' property is missing on the body request. This error applies to `carbone-version: 4` only: from `carbone-version: 5`, `data` is optional and omitting it converts the file without templating (tags left unchanged).'
      content:
        application/json:
          schema:
            type: object
            example:
              success: false
              error: Missing "data" property in body
              code: w111
    TemplateNotFoundError:
      description: The template is not found
      content:
        application/json:
          schema:
            type: object
            example:
              success: false
              error: Template not found
              code: w100
  securitySchemes:
    bearerAuth:
      type: http
      description: Get you test or production API Key on https://account.carbone.io
      scheme: bearer
      bearerFormat: eyJhbGci...
