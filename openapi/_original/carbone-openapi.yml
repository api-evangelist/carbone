    CResponseError:
      description: Error response when the request is invalid.
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
                default: false
              data:
                type: object
    UnauthorizedError:
      description: "Unauthorized, please provide a correct API key on the `Authorization` header. The API key is available on your Carbone account: https://account.carbone.io"
      content:
        application/json:
          schema:
            type: object
          examples:
            invalidKey:
              summary: "The API key is missing or invalid."
              value: { "success" : false, "error" : "Unauthorized, please provide a correct API key on the \"Authorization\" header. The API key is available on your Carbone account: https://account.carbone.io", "code" : "w120" }
            expiredKey:
              summary: "The API key or access token has expired."
              value: { "success" : false, "error" : "Unauthorized Access: The API key or access token has expired." }
    NotJsonError:
      description: "The body request type is not correct, it must be a JSON type and the `Content-type` header must be `application/json`"
      content:
        application/json:
          schema:
            type: object
            example: { "success" : false, "error" : "\"Content-Type\" header is not \"application/json\"", "code" : "w110" }
    TemplateNotFoundError:
      description: "The template is not found"
      content:
        application/json:
          schema:
            type: object
            example: { "success" : false, "error" : "Template not found", "code" : "w100" }
    ServerOrDatabaseError:
      description: "Server or Database Error."
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
                example: false
              error:
                type: string
                example: "Server or Database error."
    MissingDataFieldError:
      description: "The 'data' property is missing on the body request. This error applies to `carbone-version: 4` only: from `carbone-version: 5`, `data` is optional and omitting it converts the file without templating (tags left unchanged)."
      content:
        application/json:
          schema:
            type: object
            example: { "success" : false, "error" : "Missing \"data\" property in body", "code" : "w111" }
    ConvertBadRequestError:
      description: "The request could not be accepted: wrong content type, or document that cannot be read."
      content:
        application/json:
          schema:
            type: object
          examples:
            notJson:
              summary: "The body must be JSON and the `Content-Type` header must be `application/json`."
              value: { "success" : false, "error" : "\"Content-Type\" header is not \"application/json\"", "code" : "w110" }
            cannotRetrieve:
              summary: "The base64 document could not be read."
              value: { "success" : false, "error" : "Cannot retrieve template", "code" : "w116" }
    RenderBadRequestError:
      description: "The request could not be accepted: wrong content type, invalid template ID in the URL, or template file that cannot be read."
      content:
        application/json:
          schema:
            type: object
          examples:
            notJson:
              summary: "The body must be JSON and the `Content-Type` header must be `application/json`."
              value: { "success" : false, "error" : "\"Content-Type\" header is not \"application/json\"", "code" : "w110" }
            cannotRetrieve:
              summary: "The template file could not be read from the storage."
              value: { "success" : false, "error" : "Cannot retrieve template", "code" : "w116" }
            invalidTemplateId:
              summary: "The ID in the URL is not a Template ID (64-bit) or a Version ID (SHA256)."
              value: { "success" : false, "error" : "Invalid or undefined TemplateId or RenderId in the URL", "code" : "w115" }
    GenerateReportError:
      description: "Something went wrong when merging the JSON data-set into the template (the design of the template has an issue), or when setting up the webhook."
      content:
        application/json:
          schema:
            type: object
          examples:
            renderError:
              summary: "The document could not be generated. The message after `Unable to generate the document.` gives the cause: template design issue, impossible conversion, unknown `failOn` value, more than 4 watermarks, invalid batch options, unavailable converter, timeout..."
              value: { "success" : false, "error" : "Unable to generate the document. Format \"docx\" can't be converted to \"xlsx\".", "code" : "w101", "data" : { "renderId" : "" } }
            webhookError:
              summary: "The `carbone-webhook-url` header is set but the asynchronous job could not be registered."
              value: { "success" : false, "error" : "Error while setting up the webhook", "code" : "w117" }
    TemplateFormatError:
      description: "Template format not supported, it must be an XML-based or Text-based document."
      content:
        application/json:
          schema:
            type: object
            example: { "success" : false, "error" : "Template format not supported, it must be an XML-based or Text-based document: DOCX, XLSX, PPTX, ODT, ODS, ODP, ODG, XHTML, IDML, HTML, TXT, MD, CSV, XML, SVG, etc...", "code" : "w118" }
    MissingTemplateFieldError:
      description: "The `template` field is empty on the body request"
      content:
        application/json:
          schema:
            type: object
            example: { "success" : false, "error" : "\"template\" field is empty", "code" : "w112" }
    templateIdNotValidError:
      description: "The `template ID` is not valid"
      content:
        application/json:
          schema:
            type: object
            example: { "success" : false, "error" : "Invalid or undefined TemplateId or RenderId in the URL", "code" : "w115" }
    FileDoesNotExistError:
      description: "The file does not exist."
      content:
        application/json:
          schema:
            type: object
            example: { "success" : false, "error" : "File not found" }
    RenderIdNotValidError:
      description: "The `render ID` is not valid"
      content:
        application/json:
          schema:
            type: object
            example: { "success" : false, "error" : "Invalid or undefined TemplateId or RenderId in the URL", "code" : "w115" }
    StatelessModeError:
      description: "Carbone On-Premise only: this endpoint needs the template database, and the server runs in stateless mode (no database)."
      content:
        application/json:
          schema:
            type: object
            example: { "success" : false, "error" : "Carbone is running in stateless mode (no database), this endpoint is not available in this mode", "code" : "w130" }
    InvalidSearchFilters:
      description: "A query parameter was rejected, or the template database could not be read. The message after `Invalid search filters.` names the offending parameter and the expected range or format, or says `Database error`."
      content:
        application/json:
          schema:
            type: object
            example: { "success" : false, "error" : "Invalid search filters. Error: limit (500) must be an integer between 1 and 101.", "code" : "w125" }