paths:
  /template:
    post:
      tags:
      - "Template"
      summary: "Upload a template."
      description: |
        Uploads a new template to the Carbone storage, supporting optional metadata and advanced features like template versioning. When versioning is enabled, multiple versions of a template can be managed under the same template `id`, and specific versions can be deployed using the `deployedAt` parameter.

        ### Features
        - Metadata Support: Attach metadata such as name, comment, and tags to the template for better organization and retrieval.
        - Template Versioning: By enabling the `versioning` parameter, users can manage multiple versions of a template, allowing for a history of changes and rollbacks.
        - Deployed Version Control: Specify which version of a template is deployed using the `deployedAt` timestamp.
        - Sample Data: Attach sample input data to templates to facilitate testing and development in the Carbone Studio environment.
        
        ### Backward Compatibility
        For backward compatibility, if the `versioning` parameter is not provided or is set to false, the endpoint behaves as it did in previous versions. This means it does not enable the new versioning features and maintains the returned body request `{ "success": true, "data": { "templateId": "SHA256", "templateExtension": "docx" }}` that older applications expect.
        
        ### Use Cases
        Ideal for template management, including maintaining multiple versions of a document template, automating document generation workflows with precise control over deployments, and enhancing template metadata for better search and retrieval.
      externalDocs:
        url: "https://carbone.io/documentation/developer/http-api/manage-templates.html#upload-a-template"
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/carboneVersion'
      requestBody:
        required: true
        description: "Template file and metadata to upload. The template can be provided either as base64-encoded string or as multipart/form-data. It is important to ensure that the 'template' field is the last element in the request body."
        content:
          multipart/form-data:
            schema:
              type: object
              required:
              - "template"
              properties:
                id:
                  type: string
                  description: "[Template ID](https://carbone.io/documentation/developer/http-api/introduction.html#template-id) (64-bit format). If the `id` is provided, the new template is added to the existing Template ID’s version history. If the id field is left empty, a new Template ID is generated. Providing a Version ID (SHA256 format) is not allowed and will result in an API error."
                  example: ""
                versioning:
                  type: boolean
                  description: |
                    Template versioning is **enabled** if:
                    - `versioning` is "true" → a new [Template ID](https://carbone.io/documentation/developer/http-api/introduction.html#template-id) is generated.
                    - `versioning` is "true" and the `id` field is provided → the new template is added to the existing [Template ID](https://carbone.io/documentation/developer/http-api/introduction.html#template-id)’s version history.
                    
                    Template versioning is **disabled** if:
                    - `versioning` is "false" or "undefined", and if the `id` field is "undefined".
                template:
                  type: string
                  format: binary
                  description: "Template File, supported formats: DOCX, XLSX, PPTX, ODT, ODS, ODP, ODG, XHTML, IDML, HTML or an XML file"
                name:
                  type: string
                  maxLength: 200
                  description: "Template name, 200 characters maximum."
                comment:
                  type: string
                  maxLength: 200
                  description: "Template comment, 200 characters maximum."
                category:
                  type: string
                  maxLength: 200
                  description: "Group multiple templates into categories, similar to folders. 200 characters maximum."
                tags:
                  type: array
                  items:
                    type: string
                  description: "List of tags. Duplicates are removed and the list is returned sorted alphabetically. The whole list is limited to 100 characters, which is about 8 tags of 9 characters. In multipart/form-data, send the list as a JSON string, e.g. `[\"invoice\",\"v2\"]`."
                  example: ["invoice", "contract", "v2"]
                sample:
                  type: array
                  maxItems: 1
                  description: "Sample input data used in Carbone Studio for testing and development. A single object with the optional properties `data`, `complement`, `translations` and `enum`. In multipart/form-data, send it as a JSON string."
                  items:
                    type: object
                    additionalProperties: false
                    properties:
                      data:
                        type: object
                        description: "JSON dataset merged into the template with `{d.}` tags."
                        example: {}
                      complement:
                        type: object
                        description: "Extra data accessible in the template with `{c.}` tags."
                        example: {}
                      translations:
                        type: object
                        description: "Localization dictionary used with `{t()}` tags."
                        example: {}
                      enum:
                        type: object
                        description: "List of enumerations for use with the `convEnum` formatter."
                        example: {}
                  example:
                    - data: {}
                      complement: {}
                      translations: {}
                      enum: {}
                expireAt:
                  type: integer
                  format: int64
                  minimum: 0
                  description: |
                    Schedule the template for deletion, as a UTC Unix timestamp in seconds. Nothing changes until that time. After it, the template is no longer listed, cannot be downloaded, and generating a document with it returns `404 Template not found`. The file itself is deleted later, once the storage retention delay has passed.

                    `0` (default) means the template never expires.
                deployedAt:
                  type: integer
                  description: "When generating a document with a [Template ID](https://carbone.io/documentation/developer/http-api/introduction.html#template-id), Carbone uses the most recent deployedAt version. The deployedAt value must be a UTC Unix timestamp; values ≥ 42000000000 (year 3300) are interpreted as 'NOW'. Future values are not allowed."
                origin:
                  type: integer
                  description: |
                    Where the template comes from, used to filter the template list. Set at upload time only: it cannot be changed afterwards.
                    - `0`: API (default)
                    - `1`: Studio
                    - `2`: Salesforce
                    - `3`: Odoo
                    - `4`: HubSpot
                  example: 0
          application/json:
            schema:
              type: object
              required:
              - "template"
              properties:
                id:
                  type: string
                  description: "[Template ID](https://carbone.io/documentation/developer/http-api/introduction.html#template-id) (64-bit format). If the `id` is provided, the new template is added to the existing Template ID’s version history. If the id field is left empty, a new Template ID is generated. Providing a Version ID (SHA256 format) is not allowed and will result in an API error."
                  example: ""
                versioning:
                  type: boolean
                  description: |
                    Template versioning is **enabled** if:
                    - `versioning` is "true" → a new [Template ID](https://carbone.io/documentation/developer/http-api/introduction.html#template-id) is generated.
                    - `versioning` is "true" and the `id` field is provided → the new template is added to the existing [Template ID](https://carbone.io/documentation/developer/http-api/introduction.html#template-id)’s version history.
                    
                    Template versioning is **disabled** if:
                    - `versioning` is "false" or "undefined", and if the `id` field is "undefined".
                template:
                  type: string
                  example: "Base64-encoded Template File contents, supported formats: DOCX, XLSX, PPTX, ODT, ODS, ODP, ODG, XHTML, IDML, HTML or an XML file"
                name:
                  type: string
                  maxLength: 200
                  description: "Template name, 200 characters maximum."
                comment:
                  type: string
                  maxLength: 200
                  description: "Template comment, 200 characters maximum."
                category:
                  type: string
                  maxLength: 200
                  description: "Group multiple templates into categories, similar to folders. 200 characters maximum."
                tags:
                  type: array
                  items:
                    type: string
                  description: "List of tags. Duplicates are removed and the list is returned sorted alphabetically. The whole list is limited to 100 characters, which is about 8 tags of 9 characters."
                  example: ["invoice", "contract", "v2"]
                sample:
                  type: array
                  maxItems: 1
                  description: "Sample input data used in Carbone Studio for testing and development. A single object with the optional properties `data`, `complement`, `translations` and `enum`."
                  items:
                    type: object
                    additionalProperties: false
                    properties:
                      data:
                        type: object
                        description: "JSON dataset merged into the template with `{d.}` tags."
                        example: {}
                      complement:
                        type: object
                        description: "Extra data accessible in the template with `{c.}` tags."
                        example: {}
                      translations:
                        type: object
                        description: "Localization dictionary used with `{t()}` tags."
                        example: {}
                      enum:
                        type: object
                        description: "List of enumerations for use with the `convEnum` formatter."
                        example: {}
                  example:
                    - data: {}
                      complement: {}
                      translations: {}
                      enum: {}
                expireAt:
                  type: integer
                  format: int64
                  minimum: 0
                  description: |
                    Schedule the template for deletion, as a UTC Unix timestamp in seconds. Nothing changes until that time. After it, the template is no longer listed, cannot be downloaded, and generating a document with it returns `404 Template not found`. The file itself is deleted later, once the storage retention delay has passed.

                    `0` (default) means the template never expires.
                deployedAt:
                  type: integer
                  description: "When generating a document with a [Template ID](https://carbone.io/documentation/developer/http-api/introduction.html#template-id), Carbone uses the most recent deployedAt version. The deployedAt value must be a UTC Unix timestamp; values ≥ 42000000000 (year 3300) are interpreted as 'NOW'. Future values are not allowed."
                origin:
                  type: integer
                  description: |
                    Where the template comes from, used to filter the template list. Set at upload time only: it cannot be changed afterwards.
                    - `0`: API (default)
                    - `1`: Studio
                    - `2`: Salesforce
                    - `3`: Odoo
                    - `4`: HubSpot
                  example: 0

      responses:
        '200':    # status code
          description: On success, returns metadata about the uploaded template. When versioning is enabled, it returns a comprehensive object containing identifiers (`id` and `versionId`), file type, size, and creation timestamp. When versioning is disabled or undefined (`versioning` and `id` fields not provided), it returns only `templateId` (SHA-256 hash of the template file) and `templateExtension`.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    oneOf:
                      - type: object
                        properties:
                          id:
                            type: string
                            description: "Template ID."
                          versionId:
                            type: string
                            description: "Version ID of the template."
                          type:
                            type: string
                            description: "Type of the template file."
                          size:
                            type: integer
                            description: "Size of the template file in bytes."
                          createdAt:
                            type: integer
                            description: "UTC Unix timestamp of when the template was created."
                          deployedAt:
                            type: integer
                            description: "UTC Unix timestamp of when the template version was deployed. Returns 0 if not deployed."
                      - type: object
                        properties:
                          templateId:
                            type: string
                            description: "SHA-256 hash of the template file (for backward compatibility)."
                          templateExtension:
                            type: string
                            description: "Detected file extension of the template (e.g. `docx`)."
        '400':
          description: "The request body could not be accepted: a rejected metadata value, invalid sample data, or a malformed upload."
          content:
            application/json:
              schema:
                type: object
              examples:
                invalidMetadata:
                  summary: "A metadata field was rejected. The message names the offending field and the expected range or format."
                  value: { "success" : false, "error" : "Invalid template metadata. Error: expireAt (-1) must be an integer between 0 and 9007199254740991.", "code" : "w124" }
                invalidSample:
                  summary: "The `sample` field does not match the expected format `[{data, complement, enum, translations}]`."
                  value: { "success" : false, "error" : "Cannot store JSON sample with template file", "code" : "w128" }
                cannotStore:
                  summary: "The template file could not be stored."
                  value: { "success" : false, "error" : "Cannot store template", "code" : "w109" }
                fieldOrder:
                  summary: "In multipart/form-data, the `id` and `versioning` fields must be sent before the `template` file field."
                  value: { "success" : false, "error" : "The 'id' field must be sent before the 'template' file field in the form data.", "code" : "w131" }
                contentType:
                  summary: "The body must be multipart/form-data or JSON, and the Content-Type header must match."
                  value: { "success" : false, "error" : "Content-Type header should be multipart/form-data (preferred) or application/json (base64 mode)", "code" : "w106" }
                malformedForm:
                  summary: "The multipart/form-data body could not be parsed, or the template file exceeds the size limit."
                  value: { "success" : false, "error" : "Try uploading your file using form data", "code" : "w107" }
                fieldsTooLarge:
                  summary: "In multipart/form-data, the non-file fields (such as `sample`) exceed the JSON size limit."
                  value: { "success" : false, "error" : "Content too large, the JSON size limit is X Bytes", "code" : "w121" }
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '413':
          description: "JSON (base64) mode only: the template, or the template and sample data together, exceed the size limit. In multipart/form-data mode, an oversized file returns a `400` error."
          content:
            application/json:
              schema:
                type: object
              examples:
                templateTooLarge:
                  summary: "In JSON (base64) mode, the template file exceeds the size limit."
                  value: { "success" : false, "error" : "Template too large, the file size limit is X Bytes", "code" : "w119" }
                jsonTooLarge:
                  summary: "In JSON (base64) mode, the template and the sample data together exceed the size limit."
                  value: { "success" : false, "error" : "Template or sample data is too large. The combined size of both exceeds the limit: X Bytes", "code" : "w129" }
        '415':
          $ref: '#/components/responses/TemplateFormatError'
        '422':
          $ref: '#/components/responses/MissingTemplateFieldError'
        '500':
          $ref: '#/components/responses/ServerOrDatabaseError'
  /template/{templateId-or-versionId}:
    patch:
      tags:
      - "Template"
      summary: "Update template metadata."
      description: |
        Updates specific metadata and attributes of an existing template identified by its ID. This endpoint is crucial for managing the lifecycle and details of templates without the need to re-upload the template file. It allows for precise control over template metadata, versioning, and deployment states.

        ### Features
        - Metadata Management: Modify template metadata such as name, comment, and tags for improved organization and searchability.
        - Version Deployment: Update the `deployedAt` field to control which version of a template is actively deployed, ensuring that the correct template version is used in document generation processes.
        - Lifecycle Control: Manage the template's lifecycle by updating the expiration timestamp, allowing for fine-grained control over template availability.

        ### Which version is patched
        The identifier in the URL decides which version is patched:
        - With a [Template ID](https://carbone.io/documentation/developer/http-api/introduction.html#template-id) (64-bit format), Carbone patches the **currently deployed version** of that template.
        - With a [Version ID](https://carbone.io/documentation/developer/http-api/introduction.html#version-id) (SHA256 format), Carbone patches that exact version.

        ### Use Cases
        Updating template metadata to reflect changes in document usage or categorization, switching between template versions for deployment to support different document generation needs, and managing template lifecycle by setting expiration dates to automatically retire outdated templates.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/templateIdOrVersionId'
        - $ref: '#/components/parameters/carboneVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: string
                  description: |
                    [Template ID](https://carbone.io/documentation/developer/http-api/introduction.html#template-id) (64-bit format) the patched version belongs to. Providing a Version ID (SHA256 format) is not allowed and will result in an API error.

                    Changing this value moves the version to another Template ID. Target the version with its **Version ID** in the URL, otherwise you move the version that is currently deployed, and the original Template ID falls back to its next most recent version, or stops resolving if it has none left. An error is returned if the move creates a `deployedAt` conflict with the version already deployed under the destination Template ID.
                name:
                  type: string
                  maxLength: 200
                  description: "Template name, 200 characters maximum."
                comment:
                  type: string
                  maxLength: 200
                  description: "Template comment, 200 characters maximum."
                category:
                  type: string
                  maxLength: 200
                  description: "Group multiple templates into categories, similar to folders. 200 characters maximum."
                tags:
                  type: array
                  items:
                    type: string
                  description: "List of tags. Duplicates are removed and the list is returned sorted alphabetically. The whole list is limited to 100 characters, which is about 8 tags of 9 characters."
                expireAt:
                  type: integer
                  format: int64
                  minimum: 0
                  description: |
                    Schedule the template for deletion, as a UTC Unix timestamp in seconds. Nothing changes until that time. After it, the template is no longer listed, cannot be downloaded, and generating a document with it returns `404 Template not found`. The file itself is deleted later, once the storage retention delay has passed.

                    Send `0` to cancel a scheduled deletion and make the template permanent again. Omit the field to leave the current expiration untouched.
                deployedAt:
                  type: integer
                  format: int64
                  description: "When generating a document with a [Template ID](https://carbone.io/documentation/developer/http-api/introduction.html#template-id), Carbone uses the most recent deployedAt version. The deployedAt value must be a UTC Unix timestamp; values ≥ 42000000000 (year 3300) are interpreted as 'NOW'. Future values are not allowed."
      responses:
        '200':
          description: "Template metadata updated successfully. The response always includes `versionId`, plus any fields provided in the request body are echoed back."
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      versionId:
                        type: string
                        description: "Version ID of the updated template."
                      name:
                        type: string
                        description: "Template name, returned if updated in this request."
                      comment:
                        type: string
                        description: "Template comment, returned if updated in this request."
                      tags:
                        type: array
                        items:
                          type: string
                        description: "List of tags, returned if updated in this request."
                      category:
                        type: string
                        description: "Category name used to group templates, returned if updated in this request."
                      deployedAt:
                        type: integer
                        description: "UTC Unix timestamp of the deployed version, returned if updated in this request."
                      expireAt:
                        type: integer
                        format: int64
                        description: "UTC Unix timestamp at which the template stops being returned by the API, returned if updated in this request. `0` means the template never expires."
        '400':
          description: "The request could not be accepted: a rejected metadata value, a field that cannot be patched, an empty body, or an invalid ID in the URL."
          content:
            application/json:
              schema:
                type: object
              examples:
                invalidMetadata:
                  summary: "A field value was rejected. The message names the offending field and the expected range or format."
                  value: { "success" : false, "error" : "Invalid template metadata. Error: expireAt (-1) must be an integer between 0 and 9007199254740991.", "code" : "w124" }
                fieldNotPatchable:
                  summary: "Only `id`, `name`, `comment`, `tags`, `category`, `deployedAt` and `expireAt` can be patched."
                  value: { "success" : false, "error" : "Invalid template metadata. Error: \"origin\" is not allowed.", "code" : "w124" }
                emptyBody:
                  summary: "At least one field must be sent."
                  value: { "success" : false, "error" : "Invalid template metadata. Error: No valid attribute provided.", "code" : "w124" }
                invalidId:
                  summary: "The ID in the URL is not a Template ID (64-bit) or a Version ID (SHA256)."
                  value: { "success" : false, "error" : "Invalid or undefined TemplateId or RenderId in the URL", "code" : "w115" }
                deployedAtConflict:
                  summary: "`deployedAt` conflicts with the currently deployed version, or moves the deployed version back in time."
                  value: { "success" : false, "error" : "Invalid template metadata. Error: New \"deployedAt\" cannot be earlier than the previous value (1625097600) for the deployed template. Tip: Use value ≥ 42000000000 to deploy now (current timestamp).", "code" : "w124" }
                databaseError:
                  summary: "The update could not be saved in the template database."
                  value: { "success" : false, "error" : "Invalid template metadata. Database error", "code" : "w124" }
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/TemplateNotFoundError'
        '500':
          $ref: '#/components/responses/ServerOrDatabaseError'
        '501':
          $ref: '#/components/responses/StatelessModeError'
    get:
      tags:
      - "Template"
      summary: "Download a template or a specific version."
      description: |
        Fetches a specific template or version of a template from the Carbone storage. It supports retrieving the latest deployed version of a template using the `templateId`, as well as individual versions via `versionId`. This endpoint also allows downloading JSON data samples associated with templates or specific versions, which are used in the Studio for testing and development purposes.

        ### Features
        - Template Retrieval: Downloads the template file or its associated JSON sample based on the provided ID.
        - Version Specificity: Retrieve specific versions of a template using `versionId`, or fetch the latest deployed template using `templateId`.
        - Data Samples: Access data samples stored with templates or versions, which are useful for testing and development in the Carbone Studio environment.

        ### Parameters
        The `id` of the template or version to download, can also be specified as `{templateId}_sample.json` or `{versionId}_sample.json` to download associated data samples.
        
        ### Use Cases
        Ideal for accessing templates and their associated data samples for testing, integration, or deployment purposes. Supports scenarios requiring version-specific template retrieval or the latest deployed template versions.
      externalDocs:
        url: "https://carbone.io/documentation/developer/http-api/manage-templates.html#download-a-template"
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/templateIdOrVersionId'
        - $ref: '#/components/parameters/carboneVersion'
      responses:
        '200':
          description: "Stream of the file content"
          headers:
            content-disposition:
              schema:
                type: string
              description: "Template name, for instance: 'filename=\"{templateid}.docx\"'."
            content-type:
              schema:
                type: string
              description: "File type"
        '400':
          description: "The template ID in the URL is not valid, or the template could not be retrieved."
          content:
            application/json:
              schema:
                type: object
              examples:
                invalidId:
                  summary: "The ID in the URL is not a Template ID (64-bit) or a Version ID (SHA256)."
                  value: { "success" : false, "error" : "Invalid or undefined TemplateId or RenderId in the URL", "code" : "w115" }
                cannotRetrieve:
                  summary: "The template file could not be read from the storage."
                  value: { "success" : false, "error" : "Cannot retrieve template", "code" : "w116" }
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/TemplateNotFoundError'
        '500': 
          $ref: '#/components/responses/ServerOrDatabaseError'
    delete:
      summary: "Delete a template or a specific version."
      description: |
        Removes a specific template or a specific version of a template from the Carbone storage. This endpoint accepts both the `templateId` and `versionId`, enabling precise control over which templates or versions are deleted.

        ### Features
        - Template and Version Deletion: Deletes either the entire template, including all its versions, when using a `templateId`, or a specific version of a template when using a `versionId`.
        - Soft Deletion Mechanism: The deletion process sets the `expireAt` timestamp to the current time: the template immediately stops being returned by the API, then the file is removed once the server's retention delay has passed (Carbone Cloud: 24 hours). This is equivalent to calling `PATCH /template/{id}` with `expireAt` set to the current timestamp.
        - Bulk Version Deletion: When a `templateId` is specified, all versions of the template are marked for deletion unless otherwise specified.

        ### Parameters
        The ID of the template or version to delete. This can be a `templateId` to delete an entire template and its versions, or a `versionId` to delete a specific version.
        
        ### Use Case
        Ideal for managing the lifecycle of templates, such as cleaning up outdated versions, removing obsolete templates, or archiving specific versions while maintaining the overall template integrity.
      externalDocs:
        url: "https://carbone.io/documentation/developer/http-api/manage-templates.html#delete-a-template"
      tags:
      - "Template"
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/templateIdOrVersionId'
        - $ref: '#/components/parameters/carboneVersion'
      responses:
        '200':
          description: "The template is deleted"
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    default: true
                  message:
                    type: string
                    example: "Template deleted"
        '400':
          description: "The template ID in the URL is not valid, or the template could not be deleted."
          content:
            application/json:
              schema:
                type: object
              examples:
                invalidId:
                  summary: "The ID in the URL is not a Template ID (64-bit) or a Version ID (SHA256)."
                  value: { "success" : false, "error" : "Invalid or undefined TemplateId or RenderId in the URL", "code" : "w115" }
                cannotDelete:
                  summary: "The template could not be marked for deletion."
                  value: { "success" : false, "error" : "Cannot delete template", "code" : "w105" }
                databaseError:
                  summary: "The deletion could not be saved in the template database."
                  value: { "success" : false, "error" : "Invalid template metadata. Database error", "code" : "w124" }
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/TemplateNotFoundError'
        '500': 
          $ref: '#/components/responses/ServerOrDatabaseError'
  /templates:
    get:
      tags:
      - "Template"
      summary: "List all templates."
      description: |
        Retrieves a list of templates from the Carbone storage; with comprehensive filtering, searching, and pagination capabilities. By default, the endpoint returns all deployed templates, sorted by creation date in descending order, excluding any that have expired. It supports filtering by various criteria such as template ID, version ID, and category, offering flexibility to retrieve specific subsets of templates. Additionally, it supports fuzzy search in template names and exact matches on IDs and version IDs, enhancing discoverability.

        ### Features
        - Filtering: Filter templates by ID, version ID, and category to narrow down results based on specific criteria.
        - Search Support: Utilize fuzzy search for template names and exact matches for IDs and version IDs to quickly locate desired templates.
        - Version Inclusion: Include all versions of a template in the results by setting the `includeVersions` parameter to true, allowing for comprehensive version tracking.
        - Pagination: Employ cursor-based pagination to efficiently navigate through large datasets, enabling scalable data retrieval.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: query
          description: "Filter by [Template ID](https://carbone.io/documentation/developer/http-api/introduction.html#template-id) (64-bit format). Providing a Version ID (SHA256 format) is not allowed and will result in an API error.."
          required: false
          schema:
            type: string
        - name: versionId
          in: query
          description: "Filter by [Version ID](https://carbone.io/documentation/developer/http-api/introduction.html#version-id) (SHA256 format)."
          required: false
          schema:
            type: string
        - name: category
          in: query
          description: "Filter by category."
          required: false
          schema:
            type: string
            maxLength: 200
        - name: origin
          in: query
          required: false
          description: |
            Filter templates by their upload origin.
            - `0`: Templates uploaded via the API.
            - `1`: Templates uploaded via the Studio.
            - `2`: Templates uploaded via the Salesforce integration.
            - `3`: Templates uploaded via the Odoo integration.
            - `4`: Templates uploaded via the HubSpot integration.
          schema:
            type: number
        - name: includeVersions
          in: query
          description: "By default equals to false. Use true to list all versions for a specific template ID."
          required: false
          schema:
            type: boolean
            default: false
        - name: search
          in: query
          description: "Search in template name (fuzzy search), [Version ID](https://carbone.io/documentation/developer/http-api/introduction.html#version-id) (exact match), or [Template ID](https://carbone.io/documentation/developer/http-api/introduction.html#template-id) (exact match)."
          required: false
          schema:
            type: string
            maxLength: 200
        - name: limit
          in: query
          description: "Limit the number of items returned, from 1 to 100 (100 by default)."
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 100
        - name: cursor
          in: query
          description: "A cursor to use in pagination. The cursor defines your place in the list for fetching the next set of results."
          required: false
          schema:
            type: string
        - $ref: '#/components/parameters/carboneVersion'
      responses:
        '200':
          description: "List of deployed templates and their versions."
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          description: "A constant identifier for a template (format: 64-bit), and used to generate documents:"
                        versionId:
                          type: string
                          description: "A unique identifier for a specific version of a template (format: SHA-256 hash)."
                        deployedAt:
                          type: integer
                          format: int64
                          description: "When generating a document with a [Template ID](https://carbone.io/documentation/developer/http-api/introduction.html#template-id), Carbone uses the most recent deployedAt version. The deployedAt value must be a UTC Unix timestamp; values ≥ 42000000000 (year 3300) are interpreted as 'NOW'. Future values are not allowed."
                        createdAt:
                          type: integer
                          format: int64
                          description: "UTC Unix timestamp."
                        expireAt:
                          type: integer
                          format: int64
                          description: "UTC Unix timestamp at which the template stops being returned by the API, before being removed once the server's retention delay has passed. `0` means the template never expires."
                        size:
                          type: integer
                          format: int64
                          description: "File size in bytes."
                        type:
                          type: string
                          description: "File type (e.g. 'docx', 'xlsx', 'pptx', and more...)"
                        name:
                          type: string
                          description: "Template Name."
                        category:
                          type: string
                          description: "Category of the template."
                        comment:
                          type: string
                          description: "Template Comments."
                        tags:
                          type: array
                          items:
                            type: string
                          description: "Template Tags."
                        origin:
                          type: number
                          description: |
                            Upload origin of templates:
                            - `0`: Templates uploaded via the API.
                            - `1`: Templates uploaded via the Studio.
                            - `2`: Templates uploaded via the Salesforce integration.
                            - `3`: Templates uploaded via the Odoo integration.
                            - `4`: Templates uploaded via the HubSpot integration.
                  hasMore:
                    type: boolean
                    description: "Indicates whether additional templates are available beyond the current set. If `false`, the current response contains the last page of results."
                    example: true
                  nextCursor:
                    type: string
                    description: "If `hasMore` is `true`, this value specifies the cursor to use in the next request (via the `cursor` query parameter) to fetch the subsequent page of templates."
                    example: "cursor_hash"
        '400': 
          $ref: '#/components/responses/InvalidSearchFilters'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '500':
          $ref: '#/components/responses/ServerOrDatabaseError'
        '501':
          $ref: '#/components/responses/StatelessModeError'
  /templates/categories:
    get:
      tags:
      - "Template"
      summary: "List all categories used in templates"
      description: |
        Retrieve a list of all categories used in **deployed** templates, sorted by name. Categories function similarly to folders, allowing you to group and organize your templates effectively (e.g. "customer-x", "project-2026", "finances").

        Practical Usage:
        - **Uploading a Template:** When uploading a template, you can specify a category.
        - **Updating a Template:** You can add or modify the category when updating template metadata.
        - **Listing Templates:** You can filter templates by category to quickly find that are relevant to a specific function or type.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/carboneVersion'
      responses:
        '200':
          description: "List of categories used in templates."
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        name:
                          type: string
        '400':
          description: "The template database could not be read."
          content:
            application/json:
              schema:
                type: object
                example: { "success" : false, "error" : "Invalid search filters. Database error", "code" : "w125" }
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '500':
          $ref: '#/components/responses/ServerOrDatabaseError'
        '501':
          $ref: '#/components/responses/StatelessModeError'
  /templates/tags:
    get:
      tags:
      - "Template"
      summary: "List all tags used in templates"
      description: |
        List all tags currently used in **deployed** templates, sorted by name.
        
        Tags are labels that you can attach to your templates for better organization. They help you categorize templates based on different criteria, such as the type of document (e.g., "invoice", "contract") or the version of the template (e.g., "v19.2.1").
        
        Practical Usage:
        - **Uploading a Template:** When uploading a template, you can specify tags to categorize it.
        - **Updating a Template:** You can add or modify tags when updating template metadata.
        - **Listing Templates:** This allows you to see which tags are assigned to each template, helping you to better organize templates. It is not possible to filter templates based on tags for the moment.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/carboneVersion'
      responses:
        '200':
          description: "List of tags used in templates."
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        name:
                          type: string
        '400':
          description: "The template database could not be read."
          content:
            application/json:
              schema:
                type: object
                example: { "success" : false, "error" : "Invalid search filters. Database error", "code" : "w125" }
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '500':
          $ref: '#/components/responses/ServerOrDatabaseError'
        '501':
          $ref: '#/components/responses/StatelessModeError'
  /render/template:
    post:
      summary: "Convert a document"
      description: |
        Convert your documents to 100+ formats, including PDF, ODT, DOCX, JPG, PNG, Markdown, CSV, ODS, XLSX, CSV, ODP, PPTX, XML, HTML, TXT, IDML, and many more. See the [full conversion matrix](https://carbone.io/documentation/developer/http-api/generate-reports.html#output-file-type) for all supported input/output format combinations.

        **Two workflows are available for document conversion**:
         1. **Inline (base64)** – Send the document as a base64-encoded string in the request body field named "template". Use the special endpoint `POST /render/template?download=true`. No prior upload is needed.
         2. **Pre-uploaded template** – Upload the document once with `POST /template`, then convert it on demand using its `templateId` or `versionId` via `POST /render/{templateId-or-versionId}?download=true`.

        **Converters**: set the `converter` field to `L` (LibreOffice, default), `O` (OnlyOffice), `C` (Chromium) or `I` (Carbone ICE). See the `converter` field below and the [converters documentation](https://carbone.io/documentation/developer/http-api/generate-reports.html#converters).

        **Notes**:
        - Set the `download` query parameter to `true` to receive the converted file as a direct stream, or `false` (default) to receive a `renderId` for a separate `GET /render/{renderId}` download call.
        - For large files, set the `carbone-webhook-url` header: Carbone processes the conversion in the background and POSTs the result to your server when done.
      externalDocs:
        url: "https://carbone.io/documentation/developer/http-api/convert-reports.html"
      security:
        - bearerAuth: []
      tags:
        - "Convert"
      parameters:
        - $ref: '#/components/parameters/carboneVersion'
        - $ref: '#/components/parameters/carboneWebhookUrl'
        - $ref: '#/components/parameters/carboneWebhookHeaderAuthorization'
        - $ref: '#/components/parameters/carboneEgressHeaderAuthorization'
        - name: download
          in: query
          required: false
          description: |
            Controls how the document is returned.
            - `true`: returns the document directly as a file stream (the `Content-Type` reflects the output format). The file is not stored on Carbone servers and no `renderId` is issued, so there is no need to call `GET /render/{renderId}`.
            - `false`: returns a JSON object with a `renderId`; use `GET /render/{renderId}` to download the file in a second call.
          schema:
            type: boolean
            default: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConvertInlineRequestBody'
            examples:
              html_to_pdf_chromium:
                summary: "HTML → PDF (Chromium)"
                description: "Best for HTML/CSS/JS content. Chromium renders with full browser fidelity."
                value:
                  template: "PCFET0NUWVBFIGh0bWw+..."
                  convertTo: "pdf"
                  converter: "C"
              html_to_png_chromium:
                summary: "HTML → PNG (Chromium)"
                description: "Render an HTML page as an image. Useful for social share cards, previews, or web-based snapshots. Also works with `jpg` and `webp`."
                value:
                  template: "PCFET0NUWVBFIGh0bWw+..."
                  convertTo: "png"
                  converter: "C"
              docx_to_pdf:
                summary: "DOCX → PDF (LibreOffice)"
                description: "Convert a Word document to PDF."
                value:
                  template: "UEsDBBQABgAIAAAAIQ..."
                  convertTo: "pdf"
                  converter: "L"
              docx_to_pdf_ice:
                summary: "DOCX → PDF (Carbone ICE)"
                description: "Fastest DOCX to PDF conversion, 3x to 300x faster than LibreOffice, OnlyOffice, or MS Word. Carbone draws the PDF itself. Only the Security and Watermark PDF options are supported. See limitations: https://carbone.io/documentation/developer/http-api/generate-reports.html#converters-carbone-ice-limitations"
                value:
                  template: "UEsDBBQABgAIAAAAIQ..."
                  convertTo: "pdf"
                  converter: "I"
              xlsx_to_pdf:
                summary: "XLSX → PDF (LibreOffice)"
                description: "Convert an Excel spreadsheet to PDF."
                value:
                  template: "UEsDBBQABgAIAAAAIQ..."
                  convertTo: "pdf"
                  converter: "L"
              pptx_to_pdf:
                summary: "PPTX → PDF (LibreOffice)"
                description: "Convert a PowerPoint presentation to PDF."
                value:
                  template: "UEsDBBQABgAIAAAAIQ..."
                  convertTo: "pdf"
                  converter: "L"
              odt_to_pdf:
                summary: "ODT → PDF (LibreOffice)"
                description: "Convert an OpenDocument Text file to PDF."
                value:
                  template: "UEsDBBQABgAIAAAAIQ..."
                  convertTo: "pdf"
                  converter: "L"
              xlsx_to_csv:
                summary: "XLSX → CSV"
                description: "Extract spreadsheet data as a CSV file."
                value:
                  template: "UEsDBBQABgAIAAAAIQ..."
                  convertTo: "csv"
              docx_to_html:
                summary: "DOCX → HTML"
                description: "Convert a Word document to HTML for web display."
                value:
                  template: "UEsDBBQABgAIAAAAIQ..."
                  convertTo: "html"
              pptx_to_png:
                summary: "PPTX → PNG"
                description: "Render the first slide of a PowerPoint presentation as a PNG image."
                value:
                  template: "UEsDBBQABgAIAAAAIQ..."
                  convertTo: "png"
              html_to_pdf_password:
                summary: "HTML → Password-protected PDF"
                description: "Convert HTML to an encrypted PDF using advanced formatOptions."
                value:
                  template: "PCFET0NUWVBFIGh0bWw+..."
                  convertTo:
                    formatName: "pdf"
                    formatOptions:
                      EncryptFile: true
                      DocumentOpenPassword: "s3cr3t"
                  converter: "C"
              docx_to_pdf_onlyoffice:
                summary: "DOCX → PDF (OnlyOffice)"
                description: "Use OnlyOffice for maximum fidelity with complex DOCX/XLSX/PPTX formatting."
                value:
                  template: "UEsDBBQABgAIAAAAIQ..."
                  convertTo: "pdf"
                  converter: "O"
              md_to_docx:
                summary: "MD → DOCX (LibreOffice)"
                description: "Convert a Markdown file to a Word document."
                value:
                  template: "IyBIZWxsbyBXb3JsZA..."
                  convertTo: "docx"
                  converter: "L"
              md_to_odt:
                summary: "MD → ODT (LibreOffice)"
                description: "Convert a Markdown file to an OpenDocument Text file."
                value:
                  template: "IyBIZWxsbyBXb3JsZA..."
                  convertTo: "odt"
                  converter: "L"
              md_to_pdf:
                summary: "MD → PDF (LibreOffice)"
                description: "Convert a Markdown file to PDF."
                value:
                  template: "IyBIZWxsbyBXb3JsZA..."
                  convertTo: "pdf"
                  converter: "L"
              md_to_jpeg:
                summary: "MD → JPEG (LibreOffice)"
                description: "Convert a Markdown file to a JPEG image."
                value:
                  template: "IyBIZWxsbyBXb3JsZA..."
                  convertTo: "jpg"
                  converter: "L"
              md_to_png:
                summary: "MD → PNG (LibreOffice)"
                description: "Convert a Markdown file to a PNG image."
                value:
                  template: "IyBIZWxsbyBXb3JsZA..."
                  convertTo: "png"
                  converter: "L"
              odt_to_md:
                summary: "ODT → MD (LibreOffice)"
                description: "Convert an OpenDocument Text file to Markdown."
                value:
                  template: "UEsDBBQABgAIAAAAIQ..."
                  convertTo: "md"
                  converter: "L"
              docx_to_md:
                summary: "DOCX → MD (LibreOffice)"
                description: "Convert a Word document to Markdown."
                value:
                  template: "UEsDBBQABgAIAAAAIQ..."
                  convertTo: "md"
                  converter: "L"
              pdf_to_pdf_password:
                summary: "PDF → Password-protected PDF"
                description: "Add a password to an existing PDF using LibreOffice. The output PDF can only be opened with the specified password."
                value:
                  template: "JVBERi0xLjQKJcfs..."
                  convertTo:
                    formatName: "pdf"
                    formatOptions:
                      EncryptFile: true
                      DocumentOpenPassword: "s3cr3t"
                  converter: "L"
              pdf_to_pdfa_pdfua:
                summary: "PDF → PDF/A-4 and PDF/UA (LibreOffice)"
                description: "Re-export an existing PDF as PDF/A-4 with PDF/UA accessibility tags."
                value:
                  template: "JVBERi0xLjQKJcfs..."
                  hardRefresh: true
                  convertTo:
                    formatName: "pdf"
                    formatOptions:
                      SelectPdfVersion: 4
                      PDFUACompliance: true
                      UseTaggedPDF: true
                  converter: "L"
              pdf_to_png:
                summary: "PDF → PNG"
                description: "Render a PDF as an image, for thumbnails or previews. Also works with `jpg` and `webp`."
                value:
                  template: "JVBERi0xLjQKJcfs..."
                  convertTo: "png"
              pptx_to_webp:
                summary: "PPTX → WEBP"
                description: "Render the first slide of a PowerPoint presentation as a WEBP image. Useful for generating slide thumbnails."
                value:
                  template: "UEsDBBQABgAIAAAAIQ..."
                  convertTo: "webp"
      responses:
        "200":
          $ref: '#/components/responses/RenderSuccess'
        '400':
          $ref: '#/components/responses/ConvertBadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/TemplateNotFoundError'
        '413':
          description: "The JSON body or the base64 document exceeds the size limit."
          content:
            application/json:
              schema:
                type: object
              examples:
                jsonTooLarge:
                  summary: "The JSON body exceeds the size limit."
                  value: { "success": false, "error": "Content too large, the JSON size limit is X Bytes", "code" : "w121" }
                templateTooLarge:
                  summary: "The base64 `template` exceeds the template size limit."
                  value: { "success" : false, "error" : "Template too large, the file size limit is X Bytes", "code" : "w119" }
        '415':
          $ref: '#/components/responses/TemplateFormatError'
        '422':
          $ref: '#/components/responses/MissingDataFieldError'
        '500':
          $ref: '#/components/responses/GenerateReportError'

  /render/{templateId-or-versionId}:
    post:
      summary: "Generate a document."
      description: |
        Renders a document by merging a template with JSON data, or converts a pre-uploaded document to another format:
        - **Document generation** - merge a Carbone template (using `{d.field}` tags) with a JSON dataset to produce a customised document.
        - **Document conversion** - omit `data` (from `carbone-version: 5`) and pass a `convertTo` value to convert a pre-uploaded document (DOCX, XLSX, PPTX, HTML, ODT, ODS, ODP, ODG…) to another format. To convert without pre-uploading, use `POST /render/template` with a base64-encoded document in the body instead.
  
        ### Features
        - Dynamic Document Generation: Create documents by merging pre-designed templates with dynamic JSON data, ensuring consistency and customization in generated documents.
        - Version Support: Utilize either a template ID or a specific version ID to control which version of a template is used for rendering, allowing for precise document generation.
        - Output Format Flexibility: Generate documents in various formats by specifying output types, catering to diverse business and compliance needs.
        - Constant Template ID: Multiple versions of a template can be associated with a single Template ID. Carbone checks the deployedAt timestamp to determine which version of the template is actively deployed. The version with the most recent deployedAt timestamp is selected for document generation.


        ### Notes
        - **Direct download** - Use the `download` query parameter and set it to `true` to receive the file as a direct stream, or `false` to receive a `renderId` for a separate `GET /render/{renderId}` download call.
      externalDocs:
        url: "https://carbone.io/documentation/developer/http-api/generate-reports.html"
      security:
        - bearerAuth: []
      tags:
      - "Document"
      parameters:
        - $ref: '#/components/parameters/templateIdOrVersionId'
        - $ref: '#/components/parameters/carboneVersion'
        - $ref: '#/components/parameters/carboneWebhookUrl'
        - $ref: '#/components/parameters/carboneWebhookHeaderAuthorization'
        - $ref: '#/components/parameters/carboneEgressHeaderAuthorization'
        - name: download
          in: query
          description: |
            Controls how the document is returned.
            - `true`: returns the document directly as a file stream (the `Content-Type` reflects the output format). The file is not stored on Carbone servers and no `renderId` is issued, so there is no need to call `GET /render/{renderId}`.
            - `false`: returns a JSON object with a `renderId`; use `GET /render/{renderId}` to download the file in a second call.
          schema:
            type: boolean
            default: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  oneOf:
                    - type: object
                    - type: array
                      items: {}
                  example: { "id": "42", "name": "John", "type": "invoice" }
                  description: |
                    Optional (from `carbone-version: 5`). JSON data-set (object or array) merged into the template using `{d.}` tags.
                    If `data` is omitted, Carbone skips templating and only converts the file, leaving tags unchanged.
                    Pass `{}` to run templating with an empty data-set (tags resolve to empty).
                convertTo:
                  $ref: '#/components/schemas/ConvertToOption'
                converter:
                  $ref: '#/components/schemas/Converter'
                template:
                  type: string
                  description: "Optional - Upload a template in base64 format. When used, the URL should be /render/template."
                  example: "base64-encoded-template"
                timezone:
                  type: string
                  example: "Europe/Paris"
                  description: "Optional - Convert document dates to a timezone. The default timezone is `Europe/Paris`. The date must be chained with the `:formatD` formatter, for instance `{d.date:formatD(YYYY-MM-DD HH:MM)}`. List of accepted timezones (Column TZ identifier): https://en.wikipedia.org/wiki/List_of_tz_database_time_zones"
                lang:
                  type: string
                  example: "fr-fr"
                  description: "Optional - Locale of the generated document, it will be used for translation `{t()}`, formatting numbers with `:formatN`, and currencies `:formatC`. List of supported locales: https://github.com/carboneio/carbone/blob/master/formatters/_locale.js"
                complement:
                  type: object
                  example: {}
                  description: "Optional - Object|Array, extra data accessible in the template with {c.} instead of {d.}"
                variableStr:
                  type: string
                  example: "{#def = d.id}"
                  description: "Optional - Predefine alias, related documentation: https://carbone.io/documentation/design/substitutions/aliases.html#alias"
                reportName:
                  type: string
                  example: "{d.date}"
                  description: "Optional - Static or dynamic file name returned in the `content-disposition` header when the generated report is fetched with `GET /render/{renderId}`. The output extension is appended automatically, so do not include it. Multiple Carbone tags are accepted, such as `{d.type}-{d.date}`"
                enum:
                  type: object
                  example: {}
                  description: "Optional - List of enumerations, use it in reports with `convEnum` formatters, documentation: https://carbone.io/documentation/design/advanced-features/key-value-mapping.html#convenum-type"
                translations:
                  type: object
                  example: { "fr": { "one": "un" }, "es": { "one": "uno" } }
                  description: "Optional - When the report is generated, all text between `{t( )}` is replaced with the corresponding translation. The `lang` option is required to select the correct translation. Learn more: https://carbone.io/documentation/design/advanced-features/translations-i18n.html"
                currencySource:
                  type: string
                  example: "EUR"
                  description: "Optional - Currency source coming from your JSON data. The option is used by `formatC` to convert the currency based on the `currencyTarget` and `currencyRates`. Learn more: https://carbone.io/documentation/design/formatters/currency.html#formatc-precisionorformat-targetcurrency"
                currencyTarget:
                  type: string
                  example: "USD"
                  description: "Optional - Target currency when the document is generated. The option is used by `formatC` to convert the currency based on the `currencySource` and `currencyRates`. Learn more: https://carbone.io/documentation/design/formatters/currency.html#formatc-precisionorformat-targetcurrency"
                currencyRates:
                  type: object
                  example: { "EUR": 1, "USD": 1.2 }
                  description: "Optional - Currency exchange rates for conversions from `currencySource` to `currencyTarget`. Learn more: https://carbone.io/documentation/design/formatters/currency.html#formatc-precisionorformat-targetcurrency"
                hardRefresh:
                  type: boolean
                  example: false
                  description: "Optional - If true, the report content is refreshed at the end of the rendering process. To use this option, `convertTo` has to be defined. It is mostly used to refresh a table of content."
                batchSplitBy:
                  type: string
                  description: |
                    Optional - Generate multiple reports with one template and an array of data, one report per object. `"d"` when `data` is itself an array of objects, or `"d.myArray"` to select a direct child array of `data`.
                    Requires the `carbone-webhook-url` header (asynchronous mode) and a non-empty array of at most 100 objects on Carbone Cloud. Learn more: https://carbone.io/documentation/developer/http-api/generate-reports.html#batch-processing
                  example: "d.items"
                batchOutput:
                  type: string
                  enum: ["zip", "pdf"]
                  default: "zip"
                  description: "Optional (v5+) - Output file type for batch processing. `zip` (default) returns an archive of all the reports. `pdf` returns a concatenation of the generated PDFs, and requires `convertTo` to be `pdf`."
                  example: "zip"
                batchReportName:
                  type: string
                  description: "Optional - Name of each file inside the ZIP batch export, Carbone tags accepted (e.g. `report-{d.id}`). Ignored when `batchOutput` is `pdf`. Used together with `batchSplitBy`. From v5.14.0, an index is appended to every file (`report_1.pdf`, `report_2.pdf`) as soon as the first two reports resolve to the same name."
                  example: "report-{d.id}"
                preReleaseFeatureIn:
                  type: integer
                  example: 5000000
                  description: "Optional - Pre-release feature level for this render only. Only features and fixes introduced up to the given tag are applied, higher tags stay disabled. It overrides the server default, and can itself be overridden by the tag set in the template. Learn more: https://carbone.io/documentation/design/overview/version-lifecycle.html#pre-release-features"
                failOn:
                  type: array
                  items:
                    type: string
                    enum: ["IMAGE_URL_ERROR"]
                  example: ["IMAGE_URL_ERROR"]
                  description: |
                    Optional (v5.15.0+). Array of conditions that stop the render and return an error. The value must be an array of strings. An unknown value is rejected with an explicit error.
                    - `IMAGE_URL_ERROR`: an image that cannot be downloaded from its URL stops the report, instead of being replaced with the broken-image placeholder. An empty or undefined image value is skipped, and the report is generated as usual. Only images coming from a URL are concerned. Base64 images, barcodes and charts keep their current behavior.
                    Learn more: https://carbone.io/documentation/developer/http-api/generate-reports.html#fail-on
      responses:
        "200":
          $ref: '#/components/responses/RenderSuccess'
        '400':
          $ref: '#/components/responses/RenderBadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/TemplateNotFoundError'
        '413':
          description: "Content too large, the JSON size limit exceeded."
          content:
            application/json:
              schema:
                type: object
                example: { "success": false, "error": "Content too large, the JSON size limit is X Bytes", "code" : "w121" }
        '422':
          $ref: '#/components/responses/MissingDataFieldError'
        '500':
          $ref: '#/components/responses/GenerateReportError'
  /render/{renderId}:
    get:
      summary: "Retrieve a generated document."
      description: |
        Download a  generated document using a unique render ID. This render ID is obtained from a successful call to the `POST /render/{templateId-or-versionId}` endpoint. The retrieved document is provided as a file stream, which can be directly downloaded or viewed.

        ### Features
        - Document Retrieval: Access generated documents using a unique render ID, ensuring secure and direct retrieval.
        - Single-Use Access: The document is deleted immediately after retrieval, ensuring privacy and reducing server storage usage. Subsequent calls with the same render ID will result in a 404 error, as the document is no longer available.

        ### Authentication
        No authentication header is required for this API call, simplifying integration and access for end-users.

      externalDocs:
        url: "https://carbone.io/documentation/developer/http-api/download-reports.html"
      tags:
        - "Document"
      security: []
      parameters:
        - $ref: '#/components/parameters/renderId'
        - name: "carbone-version"
          in: "header"
          required: false
          description: "Optional for this endpoint: the `Authorization` and `carbone-version` headers are not required to download a generated document."
          schema:
            type: string
            default: "5"
        - name: download
          in: query
          description: "If set to true, changes `Content-Disposition` from `inline` to `attachment`, for direct download."
          required: false
          schema:
            type: boolean
      responses:
        '200':
          description: "Stream of the generated document. The content type will correspond to the format of the generated document, which can be any of the supported output file formats."
          content:
            # Document Formats
            application/pdf:
              schema:
                type: string
                format: binary
            application/xml:
              schema:
                type: string
                format: binary
            application/vnd.openxmlformats-officedocument.wordprocessingml.document:
              schema:
                type: string
                format: binary
            application/vnd.oasis.opendocument.text:
              schema:
                type: string
                format: binary
            application/epub+zip:
              schema:
                type: string
                format: binary
            text/plain:
              schema:
                type: string
                format: binary
            text/html:
              schema:
                type: string
                format: binary
            application/x-latex:
              schema:
                type: string
                format: binary
            text/x-bibtex:
              schema:
                type: string
                format: binary
            text/x-tex:
              schema:
                type: string
                format: binary
            # Spreadsheet Formats
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary
            application/vnd.oasis.opendocument.spreadsheet:
              schema:
                type: string
                format: binary
            text/csv:
              schema:
                type: string
                format: binary
            application/dbf:
              schema:
                type: string
                format: binary
            text/dif:
              schema:
                type: string
                format: binary
            # Presentation Formats
            application/vnd.openxmlformats-officedocument.presentationml.presentation:
              schema:
                type: string
                format: binary
            application/vnd.oasis.opendocument.presentation:
              schema:
                type: string
                format: binary
            image/bmp:
              schema:
                type: string
                format: binary
            image/x-emf:
              schema:
                type: string
                format: binary
            application/postscript:
              schema:
                type: string
                format: binary
            image/gif:
              schema:
                type: string
                format: binary
            image/jpeg:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
            image/tiff:
              schema:
                type: string
                format: binary
            application/vnd.oasis.opendocument.graphics:
              schema:
                type: string
                format: binary
            image/svg+xml:
              schema:
                type: string
                format: binary
            application/vnd.ms-powerpoint:
              schema:
                type: string
                format: binary
            image/webp:
              schema:
                type: string
                format: binary
          headers:
            content-disposition:
              schema:
                type: string
              description: "File name, for instance: 'filename=\"report.pdf\"'. The default value is 'report'. The file name can be changed dynamically thanks to the `reportName` option when generating a document with `POST /render/{templateId-or-versionId}`."
            content-type:
              schema:
                type: string
              description: "File type"

        '400':
          $ref: '#/components/responses/RenderIdNotValidError'
        '404':
          description: "Document not found, typically already retrieved and deleted."
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    default: false
                  error:
                    type: string
                    example: "File not found"
                  code:
                    type: string
                    example: "w104"
  /status:
    get:
      tags:
      - "Status"
      summary: "Fetch the API status and version"
      security: []
      responses:
        '200':
          description: "Check the API status and version"
          content:
            application/json:
              schema:
                type: object
                example: { "success": true, "code": 200, "message": "OK", "version": "5.15.0" }
                properties:
                  success:
                    type: boolean
                  code:
                    type: number
                  message:
                    type: string
                  version:
                    type: string
        '503':
          description: "The service cannot render documents (internal self-check failed), or the server is shutting down gracefully."
          content:
            application/json:
              schema:
                type: object
                example: { "success": false, "code": 503, "message": "Service cannot execute render", "version": "5.15.0" }
components:
  securitySchemes:
    bearerAuth:            # arbitrary name for the security scheme
      type: http
      description: "Get you test or production API Key on https://account.carbone.io"
      scheme: bearer
      bearerFormat: "eyJhbGci..."
  parameters:
    carboneVersion:
      name: "carbone-version"
      description: |
        Carbone API major version to use. Only a major version can be specified: it automatically includes all future minor versions and patches.
        - `5`: latest version, recommended.
        - `4`: default when the header is not provided.
        - `3`: legacy.
        - `staging`: not intended for production environments.

        It is strongly recommended to always set this header explicitly to avoid unexpected behavior.
        [See API versioning documentation](https://carbone.io/documentation/developer/http-api/introduction.html#api-version)
      in: "header"
      required: true
      schema:
        type: string
        enum: ["5", "4", "3", "staging"]
        default: "5"
    carboneEgressHeaderAuthorization:
      name: "carbone-egress-header-authorization"
      description: |
        Sets the `authorization` header Carbone sends on all egress traffic for this render: webhook calls, dynamic image URLs, and files fetched by `appendFile`.
        Example: `carbone-egress-header-authorization: my-secret` makes Carbone send `authorization: my-secret` on each outbound request.
        Only the `authorization` header can be customized, and the value must be shorter than 512 characters.
        For webhook calls, `carbone-webhook-header-authorization` overrides this value (webhook only).
      in: "header"
      required: false
      schema:
        type: string
        maxLength: 511
    carboneWebhookUrl:
      name: "carbone-webhook-url"
      description: |
        URL that Carbone calls (HTTP POST) when an asynchronous render or conversion finishes. Providing it enables asynchronous mode, which raises the rendering timeout to 5 minutes.
      in: "header"
      required: false
      schema:
        type: string
        example: "https://my-server.com/carbone-webhook"
    carboneWebhookHeaderAuthorization:
      name: "carbone-webhook-header-authorization"
      description: |
        Custom header forwarded on the webhook call only. It follows the `carbone-webhook-header-<name>` pattern, where any header `<name>` can be sent to your webhook (`authorization` is the most common).
        For the `authorization` header, this overrides `carbone-egress-header-authorization` for webhook calls.
      in: "header"
      required: false
      schema:
        type: string
    templateIdOrVersionId:
      in: path
      name: "templateId-or-versionId"
      description: "Unique identifier of the template or version ID"
      schema:
        type: string
      required: true
    renderId:
      in: path
      name: "renderId"
      description: "Unique identifier of the report"
      schema:
        type: string
      required: true
  schemas:
    Converter:
      type: string
      enum:
        - "L"
        - "O"
        - "C"
        - "I"
      default: "L"
      example: "L"
      description: |
        Converter engine to use when a document format change is required (not only when `convertTo` is `"pdf"`). If omitted, LibreOffice (`L`) is used.
        See https://carbone.io/documentation/developer/http-api/generate-reports.html#converters
        - `L` **LibreOffice** (default): DOCX, XLSX, PPTX, ODT, ODS, ODP, ODG, MD, PDF. Best balance between performance and document compatibility, and the only converter supporting all PDF options.
        - `O` **OnlyOffice**: DOCX, XLSX, PPTX to PDF. Alternative for office documents. Only the Security and Watermark PDF options are supported. From v5.15.0, Carbone ICE is recommended instead of OnlyOffice for DOCX to PDF.
        - `C` **Chromium**: HTML to PDF, JPG, PNG, WEBP. High-fidelity HTML conversion with full CSS and JavaScript support. Only the Security and Watermark PDF options are supported. 100 MB maximum document size.
        - `I` **Carbone ICE** (Instant Converter Engine): DOCX, ODT to PDF. The fastest converter, 3x to 300x faster than LibreOffice, OnlyOffice, or MS Word: Carbone draws the PDF itself, with no office suite involved. Only the Security and Watermark PDF options are supported. ODT to PDF is in beta. It can also be enabled per template with the `{o.converter=I}` tag. See limitations: https://carbone.io/documentation/developer/http-api/generate-reports.html#converters-carbone-ice-limitations
    ConvertToOption:
      description: |
        Output format for the converted/generated document.
        Can be a simple string (format name) or an object with advanced options (PDF password, watermark, image quality, CSV separator, etc.).

        **Simple string examples:** `"pdf"`, `"docx"`, `"xlsx"`, `"pptx"`, `"odt"`, `"ods"`, `"odp"`, `"html"`, `"csv"`, `"txt"`, `"png"`, `"jpg"`, `"svg"`, `"epub"`, `"md"`, `"webp"`

        **Full conversion matrix:** https://carbone.io/documentation/developer/http-api/generate-reports.html#output-file-type

        **Object form (PDF with options):**
        ```json
            {
              "formatName": "pdf",
              "formatOptions": {
                "EncryptFile": true,
                "DocumentOpenPassword": "s3cr3t",
                "Watermark": "CONFIDENTIAL"
              }
            }
        ```

        **Object form (PDF with multiple watermarks):**
        ```json
            {
              "formatName": "pdf",
              "formatOptions": {
                "Watermarks": [
                  {
                    "text": "Confidential - Page {#PAGE_NUMBER} / {#PAGE_TOTAL}",
                    "anchor": "center",
                    "rotation": -45,
                    "opacity": 0.1
                  }
                ]
              }
            }
        ```

        **Object form (JPG with options):**
        ```json
            {
              "formatName": "jpg",
              "formatOptions": { "Quality": 80, "ColorMode": 0 }
            }
        ```

        **Object form (CSV with options):**
        ```json
            {
              "formatName": "csv",
              "formatOptions": { "fieldSeparator": ";", "textDelimiter": "\"", "characterSet": "76" }
            }
        ```
      oneOf:
        - type: string
          example: "pdf"
          description: "Target format name (e.g. pdf, docx, xlsx, pptx, odt, ods, html, csv, png, jpg, svg, epub, md, webp…)"
        - type: object
          description: "Target format with advanced options."
          required:
            - formatName
          properties:
            formatName:
              type: string
              description: "Target format name."
              example: "pdf"
            formatOptions:
              type: object
              description: |
                Format-specific options. See the full option list for each format:
                - PDF: https://carbone.io/documentation/developer/http-api/generate-reports.html#pdf-options
                - JPG/PNG: https://carbone.io/documentation/developer/http-api/generate-reports.html#jpg-png-options
                - CSV: https://carbone.io/documentation/developer/http-api/generate-reports.html#csv-options
                - Watermarks: https://carbone.io/documentation/developer/http-api/generate-reports.html#watermark-options

                PDF options availability varies by converter: LibreOffice (`L`) supports all of them, Chromium (`C`), OnlyOffice (`O`) and Carbone ICE (`I`) only the Security and Watermark options.
              properties:
                # ── PDF options ───────────────────────────────────────────────
                # General
                SelectPdfVersion:
                  type: integer
                  default: 0
                  enum: [0, 1, 2, 3, 4, 15, 16, 17, 20]
                  description: "PDF version to emit. 0: PDF 1.6 Standard. 1: PDF/A-1 (ISO 19005-1:2005). 2: PDF/A-2 (ISO 19005-2:2011). 3: PDF/A-3 (ISO 19005-3:2012). 4: PDF/A-4 (ISO 19005-4). 15: PDF 1.5 Standard. 16: PDF 1.6 Standard. 17: PDF 1.7 Standard. 20: PDF 2.0 Standard. LibreOffice only."
                ConvertOOoTargetToPDFTarget:
                  type: boolean
                  default: false
                  description: "Renames .od[tpgs] links to .pdf in the exported PDF, leaving the source untouched. LibreOffice only."
                ExportFormFields:
                  type: boolean
                  default: true
                  description: "Specifies whether form fields are exported as widgets or only as fixed print representation. LibreOffice only."
                ExportLinksRelativeFsys:
                  type: boolean
                  default: false
                  description: "Exports file system hyperlinks as relative to the source document. LibreOffice only."
                ExportNotes:
                  type: boolean
                  default: true
                  description: "Specifies if notes are exported to PDF. LibreOffice only."
                ExportNotesPages:
                  type: boolean
                  default: false
                  description: "Specifies if notes pages are exported to PDF (Impress only). LibreOffice only."
                FormsType:
                  type: integer
                  default: 0
                  enum: [0, 1, 2, 3]
                  description: "Format for PDF form submission. 0: FDF. 1: PDF. 2: HTML. 3: XML. LibreOffice only."
                IsAddStream:
                  type: boolean
                  default: false
                  description: "Adds a stream containing the original document for archiving (PDF Import only). LibreOffice only."
                IsSkipEmptyPages:
                  type: boolean
                  default: false
                  description: "Suppresses auto-inserted empty pages (Writer only). LibreOffice only."
                UseTransitionEffects:
                  type: boolean
                  default: true
                  description: "Exports slide transitions to PDF (Impress only). LibreOffice only."
                # Security
                DocumentOpenPassword:
                  type: string
                  description: "Password required to open the PDF. Only active when `EncryptFile` is true."
                EncryptFile:
                  type: boolean
                  default: false
                  description: "Encrypt the PDF with AES-256; the `DocumentOpenPassword` is required to open it. The document properties (Title, Author, Subject, and the other Info strings) are encrypted as well, so they cannot be read without the password."
                PermissionPassword:
                  type: string
                  description: "Password required to change restricted permissions. Only active when `RestrictPermissions` is true."
                RestrictPermissions:
                  type: boolean
                  default: false
                  description: "Enables restricted permissions in the PDF document (printing, copying, changes). Must be used with `PermissionPassword`."
                Changes:
                  type: integer
                  default: 4
                  enum: [0, 1, 2, 3, 4]
                  description: "What changes are allowed in the PDF. 0: None. 1: Insert/delete/rotate pages. 2: Fill forms. 3: Comment/fill forms. 4: Any except page extraction. Requires `RestrictPermissions: true` and `PermissionPassword`."
                EnableCopyingOfContent:
                  type: boolean
                  default: true
                  description: "Allows copying content to other documents. Requires `RestrictPermissions: true` and `PermissionPassword`."
                EnableTextAccessForAccessibilityTools:
                  type: boolean
                  default: true
                  description: "Allows text extraction for accessibility tools. Requires `RestrictPermissions: true` and `PermissionPassword`."
                Printing:
                  type: integer
                  default: 2
                  enum: [0, 1, 2]
                  description: "Allowed printing. 0: None. 1: Low resolution (150 DPI). 2: Max resolution. Requires `RestrictPermissions: true` and `PermissionPassword`."
                # Compression & Quality
                MaxImageResolution:
                  type: integer
                  default: 300
                  enum: [75, 150, 300, 600, 1200]
                  description: "Reduce images to this DPI when `ReduceImageResolution` is true. LibreOffice only."
                ReduceImageResolution:
                  type: boolean
                  default: false
                  description: "Reduces image resolution to `MaxImageResolution`. LibreOffice only."
                UseLosslessCompression:
                  type: boolean
                  default: true
                  description: "Use PNG (lossless) or JPEG compression for graphics. LibreOffice only."
                # Watermark
                Watermark:
                  type: string
                  description: "Legacy field (backward compatible). Renders a single centered watermark at 45° with default styling on every page of the exported PDF file. It counts towards the maximum of 4 watermarks. Supported by all converters."
                Watermarks:
                  type: array
                  description: "New in v5.3.0. Define up to 4 watermarks per document, each fully configurable. Can be used simultaneously with the legacy `Watermark` field, which counts towards the 4: above that, the render returns `A maximum of 4 watermarks can be used at the same time`. Supported by all converters."
                  maxItems: 4
                  items:
                    type: object
                    required:
                      - text
                    properties:
                      text:
                        type: string
                        maxLength: 2000
                        description: "The watermark label. Supports `{#PAGE_NUMBER}` and `{#PAGE_TOTAL}` variables for dynamic page numbering."
                        example: "Confidential - Page {#PAGE_NUMBER} / {#PAGE_TOTAL}"
                      anchor:
                        type: string
                        default: "center"
                        description: "Position of the watermark on the page."
                        enum: [topLeft, top, topRight, left, center, right, bottomLeft, bottom, bottomRight]
                      offsetX:
                        type: number
                        default: 0
                        description: "Horizontal offset in points (pt) from the anchor. In PDFs, the origin is bottom-left, so positive values move right."
                      offsetY:
                        type: number
                        default: 0
                        description: "Vertical offset in points (pt) from the anchor. Positive values move up."
                      rotation:
                        type: number
                        minimum: -360
                        maximum: 360
                        description: "Rotation in degrees, between -360 and 360. Defaults to 45 for the `center` anchor, 0 for others. For non-center anchors, only 0, 90, or -90 are allowed."
                      color:
                        type: string
                        default: "#000000"
                        description: "Watermark text color in `#RGB` or `#RRGGBB` format."
                        example: "#000000"
                      size:
                        type: number
                        minimum: 1
                        maximum: 2000
                        description: "Font size in pt. For `center` anchor, defaults to automatic. For all other anchors, defaults to 12."
                      opacity:
                        type: number
                        minimum: 0
                        maximum: 1
                        description: "Opacity between 0 and 1. For `center` anchor, defaults to 0.1. For all other anchors, defaults to 1."
                      font:
                        type: string
                        default: "Helvetica"
                        description: "Font family for the watermark text."
                        enum:
                          - Courier
                          - Courier-Bold
                          - Courier-Oblique
                          - Courier-BoldOblique
                          - Helvetica
                          - Helvetica-Bold
                          - Helvetica-Oblique
                          - Helvetica-BoldOblique
                          - Times-Roman
                          - Times-Bold
                          - Times-Italic
                          - Times-BoldItalic
                      fromPage:
                        type: integer
                        minimum: 1
                        default: 1
                        description: "First page (1-based) on which the watermark is applied."
                      toPage:
                        type: integer
                        minimum: 1
                        description: "Last page (1-based) on which the watermark is applied. Defaults to all remaining pages."
                # Accessibility
                UseTaggedPDF:
                  type: boolean
                  default: false
                  description: "Creates a PDF with special tags (Tagged PDF). LibreOffice only."
                PDFUACompliance:
                  type: boolean
                  default: false
                  description: "Enables the PDF/UA Universal Accessibility standard (ISO 14289). LibreOffice only."
                AllowDuplicateFieldNames:
                  type: boolean
                  default: false
                  description: "Allows export of multiple form fields with the same name. LibreOffice only."
                # View / Appearance
                CenterWindow:
                  type: boolean
                  default: false
                  description: "Opens the PDF centered on screen. LibreOffice only."
                DisplayPDFDocumentTitle:
                  type: boolean
                  default: true
                  description: "Shows the document title in the viewer window. LibreOffice only."
                ExportBookmarks:
                  type: boolean
                  default: true
                  description: "Exports bookmarks to PDF. LibreOffice only."
                ExportBookmarksToPDFDestination:
                  type: boolean
                  default: false
                  description: "Exports bookmarks as named destinations. LibreOffice only."
                FirstPageOnLeft:
                  type: boolean
                  default: false
                  description: "Used with `PageLayout`: the odd first page appears on the left. LibreOffice only."
                HideViewerMenubar:
                  type: boolean
                  default: false
                  description: "Hides the PDF viewer menubar. LibreOffice only."
                HideViewerToolbar:
                  type: boolean
                  default: false
                  description: "Hides the PDF viewer toolbar. LibreOffice only."
                HideViewerWindowControls:
                  type: boolean
                  default: false
                  description: "Hides the PDF viewer window controls. LibreOffice only."
                InitialPage:
                  type: integer
                  default: 1
                  description: "Page number on which the PDF opens. LibreOffice only."
                InitialView:
                  type: integer
                  default: 0
                  enum: [0, 1, 2]
                  description: "Display mode on open. 0: None. 1: Outline pane. 2: Thumbnail pane. LibreOffice only."
                Magnification:
                  type: integer
                  default: 0
                  enum: [0, 1, 2, 3, 4]
                  description: "Open action. 0: Default. 1: Fit page. 2: Fit width. 3: Fit width of bounding box. 4: Zoom set by `Zoom`. LibreOffice only."
                OpenBookmarkLevels:
                  type: integer
                  default: -1
                  description: "Number of bookmark levels opened on startup (-1 = all). LibreOffice only."
                OpenInFullScreenMode:
                  type: boolean
                  default: false
                  description: "Opens the PDF in full screen. LibreOffice only."
                PageLayout:
                  type: integer
                  default: 0
                  enum: [0, 1, 2, 3]
                  description: "Page layout. 0: Reader default. 1: Single. 2: One column. 3: Two columns (see `FirstPageOnLeft`). LibreOffice only."
                PageRange:
                  type: string
                  description: "Range of pages to include (e.g. '1-5'). Leave unset to export all pages. LibreOffice only."
                PDFViewSelection:
                  type: integer
                  default: 0
                  enum: [0, 1, 2]
                  description: "PDF viewing. 0: All links as URI. 1: PDF reader only (not for PDF/A-1). 2: Internet browser with plugin (see `ExportBookmarksToPDFDestination`). LibreOffice only."
                ResizeWindowToInitialPage:
                  type: boolean
                  default: false
                  description: "Resizes the viewer to the first page at open. LibreOffice only."
                Zoom:
                  type: integer
                  default: 100
                  description: "Zoom percent when `Magnification` is 4. LibreOffice only."
                # ── JPG / PNG options ─────────────────────────────────────────
                PixelWidth:
                  type: number
                  description: "Output image width in pixels. Defaults to document width."
                PixelHeight:
                  type: number
                  description: "Output image height in pixels. Defaults to document height."
                ColorMode:
                  type: number
                  default: 0
                  description: "Color mode. 0: Colors. 1: Greyscale."
                Quality:
                  type: number
                  minimum: 1
                  maximum: 100
                  description: "JPG quality, from 1 (low quality, high compression, low size) to 100 (high quality). For a `jpg` export the default is 100. For a `pdf` export, it sets the JPG compression quality of images and defaults to 90 (LibreOffice only)."
                Compression:
                  type: number
                  default: 0
                  description: "PNG compression level, from 0 (disabled) to 9 (maximum)."
                Interlaced:
                  type: number
                  default: 0
                  description: "PNG interlacing. 0: Not interlaced. 1: Interlaced."
                Translucent:
                  type: number
                  default: 0
                  description: "PNG transparency. 0: No transparent background. 1: Transparent background."
                # ── CSV options ───────────────────────────────────────────────
                fieldSeparator:
                  type: string
                  description: "CSV field separator character (e.g. `,`, `;`, `+`)."
                textDelimiter:
                  type: string
                  description: "CSV text delimiter character (e.g. `\"`)."
                characterSet:
                  type: string
                  description: "CSV character encoding. See https://wiki.openoffice.org/wiki/Documentation/DevGuide/Spreadsheets/Filter_Options for accepted values (e.g. '76' for UTF-8)."
              additionalProperties: false
    ConvertInlineRequestBody:
      type: object
      required:
        - template
      properties:
        template:
          type: string
          description: |
            **Required for inline conversion.** The source document encoded as a base64 string.
            Supported input formats: DOCX, DOC, XLSX, XLS, PPTX, PPT, PDF, ODT, ODS, ODP, ODG, RTF, TXT, CSV, HTML, XHTML, MD (Markdown), IDML, XML.
          example: "PCFET0NUWVBFIGh0bWw+..."
        data:
          oneOf:
            - type: object
            - type: array
              items: {}
          example: {}
          description: |
            Optional (from `carbone-version: 5`). JSON data-set merged into the document using `{d.}` tags.
            Omit `data` for a pure conversion: Carbone skips templating and leaves tags unchanged.
            Pass `{}` to run templating with an empty data-set (tags resolve to empty).
        convertTo:
          $ref: '#/components/schemas/ConvertToOption'
        converter:
          $ref: '#/components/schemas/Converter'
        timezone:
          type: string
          example: "Europe/Paris"
          description: "Convert document dates to a timezone. The date must be chained with the `:formatD` formatter. List of accepted timezones: https://en.wikipedia.org/wiki/List_of_tz_database_time_zones"
        lang:
          type: string
          example: "fr-fr"
          description: "Locale of the generated document, used for translations `{t()}`, number formatting `:formatN`, and currencies `:formatC`. List of supported locales: https://github.com/carboneio/carbone/blob/master/formatters/_locale.js"
        complement:
          type: object
          example: {}
          description: "Extra data accessible in the template with `{c.}` instead of `{d.}`."
        variableStr:
          type: string
          example: "{#def = d.id}"
          description: "Predefined alias. See: https://carbone.io/documentation/design/substitutions/aliases.html#alias"
        reportName:
          type: string
          example: "{d.date}"
          description: "Static or dynamic output file name returned in the `content-disposition` header. The output extension is appended automatically, so do not include it. Supports multiple Carbone tags, e.g. `{d.type}-{d.date}`."
        enum:
          type: object
          example: {}
          description: "List of enumerations for use with the `convEnum` formatter. See: https://carbone.io/documentation/design/advanced-features/key-value-mapping.html#convenum-type"
        translations:
          type: object
          example: { "fr": { "one": "un" }, "es": { "one": "uno" } }
          description: "Localization dictionary used with `{t( )}` tags. Requires the `lang` option."
        currencySource:
          type: string
          example: "EUR"
          description: "Source currency from your JSON data, used by `formatC` for currency conversion."
        currencyTarget:
          type: string
          example: "USD"
          description: "Target currency for the generated document, used by `formatC`."
        currencyRates:
          type: object
          example: { "EUR": 1, "USD": 1.2 }
          description: "Currency exchange rates for `formatC` conversion."
        hardRefresh:
          type: boolean
          example: false
          description: "If true, recomputes pagination and table of contents at the end of rendering. Requires `convertTo` to be defined."
        batchSplitBy:
          type: string
          description: |
            Optional - Generate multiple reports with one template and an array of data, one report per object. `"d"` when `data` is itself an array of objects, or `"d.myArray"` to select a direct child array of `data`.
            Requires the `carbone-webhook-url` header (asynchronous mode) and a non-empty array of at most 100 objects on Carbone Cloud. Learn more: https://carbone.io/documentation/developer/http-api/generate-reports.html#batch-processing
          example: "d.items"
        batchOutput:
          type: string
          enum: ["zip", "pdf"]
          default: "zip"
          description: "Optional (v5+) - Output file type for batch processing. `zip` (default) returns an archive of all the reports. `pdf` returns a concatenation of the generated PDFs, and requires `convertTo` to be `pdf`."
          example: "zip"
        batchReportName:
          type: string
          description: "Optional - Name of each file inside the ZIP batch export, Carbone tags accepted (e.g. `report-{d.id}`). Ignored when `batchOutput` is `pdf`. Used together with `batchSplitBy`. From v5.14.0, an index is appended to every file (`report_1.pdf`, `report_2.pdf`) as soon as the first two reports resolve to the same name."
          example: "report-{d.id}"
        preReleaseFeatureIn:
          type: integer
          example: 5000000
          description: "Optional - Pre-release feature level for this render only. Only features and fixes introduced up to the given tag are applied, higher tags stay disabled. Learn more: https://carbone.io/documentation/design/overview/version-lifecycle.html#pre-release-features"
        failOn:
          type: array
          items:
            type: string
            enum: ["IMAGE_URL_ERROR"]
          example: ["IMAGE_URL_ERROR"]
          description: "Optional (v5.15.0+). Array of conditions that stop the render and return an error. `IMAGE_URL_ERROR`: an image that cannot be downloaded from its URL stops the report. Learn more: https://carbone.io/documentation/developer/http-api/generate-reports.html#fail-on"

  responses:
    RenderSuccess:
      description: |
        On success, by default a JSON response containing the `renderId` is returned.
        If the query parameter `download=true` is used, the response body is the converted/generated file stream and the Content-Type reflects the output format.
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
                default: true
              data:
                type: object
                description: "In asynchronous mode (`carbone-webhook-url` header set), `renderId` is an empty string: the real one is sent to the webhook."
                properties:
                  renderId:
                    type: string
                    example: "MTAuMjAuMjEuMTAgICAg.pdf"
              message:
                type: string
                description: "Returned only in asynchronous mode (`carbone-webhook-url` header set). The webhook URL is then called with `{ \"success\": true, \"data\": { \"renderId\": \"...\" } }` once the document is generated."
                example: "A render ID will be sent to your callback URL when the document is generated"
