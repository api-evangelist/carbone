description: >-
  Carbone offers three deployment tracks — Cloud (hosted by European
  providers OVHCloud / Scaleway / BunnyCDN), On-Premises (self-hosted) and
  AWS Private Cloud (usage-based). The Cloud tiers run from Free up to
  Advanced Ultra with monthly or annual billing. Document generation is
  metered per 1 MB of injected data on Cloud plans.
notes: >-
  Prices reflect the public carbone.io/pricing page as of 2026-05-08;
  exclusive of VAT and subject to French VAT for EU customers without
  exemption. The Carbone JS rendering engine is open-source and free.
sources:
- https://carbone.io/pricing.html
- https://github.com/carboneio/carbone
