principles:
- name: Visibility
  description: Use Carbone account dashboard for Cloud usage; integrate AWS Cost Management for AWS PC; track on-prem renders via your own logs.
- name: Allocation
  description: Use template IDs and per-team API keys to allocate cost; for AWS PC, tag the AWS account.
- name: Optimization
  description: Pick the right deployment track (Cloud vs On-Prem vs AWS PC); right-size Cloud tier; embed OSS engine for low-volume / no-egress workloads; use compact JSON to minimise per-MB accounting.
- name: Accountability
  description: Assign template / API-key owners; review monthly Cloud usage and AWS PC invoice line items.
