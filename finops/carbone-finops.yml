description: >-
  FOCUS-aligned FinOps profile for Carbone. Costs come from one of three
  tracks — Cloud subscription (Free/Essential/Essential Plus/Advanced/
  Advanced Plus/Advanced Ultra), On-Prem annual license (Free/Fit/Unlimited)
  or AWS Private Cloud per-document usage. The OSS rendering engine remains
  free for embed.
notes: >-
  Carbone documents are accounted per 1 MB of injected JSON, so high-volume
  small documents may be cheaper than expected; large datasets-per-render
  may push usage faster than document count alone suggests.
